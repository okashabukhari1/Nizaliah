<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo-dark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="NIZALIAH — JANAN SPORT Eau de Parfum. A luxury fragrance house."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Manrope:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>NIZALIAH — JANAN SPORT</title>
    <style>
      #niz-intro {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(ellipse at 40% 35%, #fbf7f2 0%, #f4dedf 42%, #e8dccb 78%, #dcc9b0 100%);
        color: #3e2e22;
        overflow: hidden;
        cursor: default;
        user-select: none;
      }
      #niz-intro.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #niz-intro .niz-intro-glow {
        position: absolute;
        width: 55vmax;
        height: 55vmax;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(212, 175, 55, 0.18) 0%, transparent 68%);
        pointer-events: none;
        transform: translate(-50%, -50%);
        left: 50%;
        top: 42%;
        will-change: transform;
      }
      #niz-intro .niz-intro-particles {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      #niz-intro .niz-particle {
        position: absolute;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #d4af37;
        opacity: 0.35;
        will-change: transform, opacity;
      }
      #niz-intro .niz-intro-orb {
        position: absolute;
        width: min(72vw, 300px);
        height: min(72vw, 300px);
        border-radius: 50%;
        border: 1px solid rgba(212, 175, 55, 0.28);
        pointer-events: none;
        left: 50%;
        top: 48%;
        transform: translate(-50%, -50%);
        opacity: 0;
        will-change: transform;
      }
      #niz-intro .niz-intro-orb--2 {
        width: min(88vw, 420px);
        height: min(88vw, 420px);
        border-color: rgba(123, 94, 59, 0.2);
      }
      #niz-intro .niz-intro-inner {
        position: relative;
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 1.5rem 1.25rem 2rem;
        width: min(94vw, 720px);
      }
      #niz-intro .niz-intro-logo {
        width: min(42vw, 180px);
        height: auto;
        object-fit: contain;
        margin-bottom: 0.25rem;
        opacity: 0;
      }
      #niz-intro .niz-intro-mark {
        display: none;
      }
      #niz-intro .niz-intro-sub {
        font-family: Manrope, system-ui, sans-serif;
        font-size: 10px;
        letter-spacing: 0.42em;
        color: #7b5e3b;
        margin-top: 0.55rem;
        opacity: 0;
      }
      #niz-intro #niz-intro-keyboard {
        position: relative;
        width: min(92vw, 680px);
        height: min(42vw, 260px);
        margin: 0.35rem 0 0.1rem;
        opacity: 0;
        z-index: 4;
      }
      #niz-intro .niz-intro-typed {
        position: relative;
        z-index: 5;
        min-width: min(70vw, 280px);
        margin-top: 0.85rem;
        padding: 0.85rem 1.4rem;
        border: 1px solid rgba(62, 46, 34, 0.28);
        background: rgba(248, 244, 238, 0.72);
        backdrop-filter: blur(10px);
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: clamp(1.35rem, 3.2vw, 1.85rem);
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        color: #3e2e22;
        text-transform: uppercase;
        opacity: 0;
      }
      #niz-intro .niz-intro-typed.is-empty {
        color: rgba(62, 46, 34, 0.38);
        letter-spacing: 0.28em;
        text-indent: 0.28em;
        font-size: clamp(0.7rem, 2vw, 0.85rem);
        font-family: Manrope, system-ui, sans-serif;
      }
      #niz-intro .niz-intro-typed.is-match {
        border-color: #d4af37;
        color: #3e2e22;
        box-shadow: 0 0 0 1px rgba(212, 175, 55, 0.35);
      }
      #niz-intro .niz-intro-track {
        position: relative;
        width: min(100%, 420px);
        height: 3px;
        background: rgba(62, 46, 34, 0.14);
        margin-top: 1.35rem;
        overflow: hidden;
        opacity: 0;
        border-radius: 2px;
      }
      #niz-intro .niz-intro-bar {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, #7b5e3b, #d4af37);
        box-shadow: 0 0 12px rgba(212, 175, 55, 0.45);
        transform: scaleX(0);
        transform-origin: left center;
        will-change: transform;
      }
      #niz-intro .niz-intro-meta {
        display: flex;
        justify-content: space-between;
        width: min(100%, 420px);
        margin-top: 0.75rem;
        font-family: Manrope, system-ui, sans-serif;
        font-size: 10px;
        letter-spacing: 0.28em;
        color: #7b5e3b;
        opacity: 0;
      }
      #niz-intro .niz-intro-hint {
        margin-top: 1rem;
        font-family: Manrope, system-ui, sans-serif;
        font-size: 9px;
        letter-spacing: 0.32em;
        color: rgba(62, 46, 34, 0.45);
        opacity: 0;
      }
      body {
        margin: 0;
        background: #f8f4ee;
      }
    </style>
  </head>
  <body>
    <div id="niz-intro" aria-live="polite" aria-busy="true">
      <div class="niz-intro-glow" data-glow aria-hidden="true"></div>
      <div class="niz-intro-particles" data-particles aria-hidden="true"></div>
      <div class="niz-intro-orb" data-orb="1" aria-hidden="true"></div>
      <div class="niz-intro-orb niz-intro-orb--2" data-orb="2" aria-hidden="true"></div>
      <div class="niz-intro-inner">
        <img class="niz-intro-logo" src="/images/logo-dark.png" alt="NIZALIAH Perfume" />
        <div class="niz-intro-mark">NIZALIAH</div>
        <div id="niz-intro-keyboard" aria-hidden="true"></div>
        <div
          class="niz-intro-typed is-empty"
          id="niz-intro-typed"
          aria-live="polite"
        >TYPE ENTER</div>
        <div class="niz-intro-sub">EAU DE PARFUM</div>
        <div class="niz-intro-track" aria-hidden="true">
          <div class="niz-intro-bar" id="niz-intro-bar"></div>
        </div>
        <div class="niz-intro-meta">
          <span id="niz-intro-status">COMPOSING</span>
          <span id="niz-intro-pct">0%</span>
        </div>
        <div class="niz-intro-hint">WAIT FOR LOAD</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
