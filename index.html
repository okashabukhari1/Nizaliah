<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo-dark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="NIZALIAH — JANAN SPORT Eau de Parfum. A luxury fragrance house."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Manrope:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>NIZALIAH — JANAN SPORT</title>
    <style>
      #niz-intro {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background:
          linear-gradient(165deg, #fbf7f2 0%, #f0e4d4 48%, #e5d5c2 100%);
        color: #3e2e22;
        overflow: hidden;
        cursor: wait;
        user-select: none;
      }
      #niz-intro.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #niz-intro .niz-intro-wash {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 55% 40% at 20% 15%, rgba(212, 175, 55, 0.14), transparent 70%),
          radial-gradient(ellipse 50% 45% at 85% 80%, rgba(123, 94, 59, 0.1), transparent 65%);
        pointer-events: none;
      }
      #niz-intro .niz-intro-rule {
        position: absolute;
        left: 8%;
        right: 8%;
        height: 1px;
        background: rgba(62, 46, 34, 0.12);
        pointer-events: none;
        opacity: 0;
      }
      #niz-intro .niz-intro-rule--top { top: 9%; }
      #niz-intro .niz-intro-rule--bottom { bottom: 9%; }
      #niz-intro .niz-intro-inner {
        position: relative;
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        text-align: left;
        padding: 1.5rem 1.5rem 2rem;
        width: min(90vw, 520px);
      }
      #niz-intro .niz-intro-brand {
        font-family: Manrope, system-ui, sans-serif;
        font-size: 10px;
        letter-spacing: 0.48em;
        color: #7b5e3b;
        margin-bottom: 1.1rem;
        opacity: 0;
      }
      #niz-intro .niz-intro-logo {
        width: min(42vw, 160px);
        height: auto;
        object-fit: contain;
        margin-bottom: 2rem;
        opacity: 0;
      }
      #niz-intro .niz-intro-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        width: 100%;
        gap: 1.5rem;
        opacity: 0;
      }
      #niz-intro .niz-intro-counter {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-weight: 300;
        font-size: clamp(4.5rem, 14vw, 7.5rem);
        line-height: 0.85;
        letter-spacing: -0.03em;
        color: #3e2e22;
        font-variant-numeric: tabular-nums;
      }
      #niz-intro .niz-intro-counter span {
        display: inline-block;
        min-width: 1.25em;
      }
      #niz-intro .niz-intro-side {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 0.35rem;
        padding-bottom: 0.35rem;
      }
      #niz-intro .niz-intro-unit {
        font-family: Manrope, system-ui, sans-serif;
        font-size: 10px;
        letter-spacing: 0.36em;
        color: #d4af37;
      }
      #niz-intro .niz-intro-status {
        font-family: Manrope, system-ui, sans-serif;
        font-size: 9px;
        letter-spacing: 0.28em;
        color: rgba(62, 46, 34, 0.55);
      }
      #niz-intro .niz-intro-track {
        position: relative;
        width: 100%;
        height: 2px;
        background: rgba(62, 46, 34, 0.12);
        margin-top: 1.75rem;
        overflow: hidden;
        opacity: 0;
      }
      #niz-intro .niz-intro-bar {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, #3e2e22, #7b5e3b 40%, #d4af37);
        transform: scaleX(0);
        transform-origin: left center;
        will-change: transform;
      }
      #niz-intro .niz-intro-meta {
        display: flex;
        justify-content: space-between;
        width: 100%;
        margin-top: 0.85rem;
        font-family: Manrope, system-ui, sans-serif;
        font-size: 9px;
        letter-spacing: 0.28em;
        color: rgba(62, 46, 34, 0.5);
        opacity: 0;
      }
      #niz-intro .niz-intro-line {
        margin-top: 1.75rem;
        max-width: 18rem;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: clamp(1.05rem, 2.5vw, 1.3rem);
        font-weight: 300;
        font-style: italic;
        letter-spacing: 0.02em;
        color: rgba(62, 46, 34, 0.72);
        opacity: 0;
      }
      body {
        margin: 0;
        background: #f8f4ee;
      }
      body.niz-loading {
        overflow: hidden;
      }
    </style>
  </head>
  <body class="niz-loading">
    <div id="niz-intro" aria-live="polite" aria-busy="true">
      <div class="niz-intro-wash" aria-hidden="true"></div>
      <div class="niz-intro-rule niz-intro-rule--top" data-rule aria-hidden="true"></div>
      <div class="niz-intro-rule niz-intro-rule--bottom" data-rule aria-hidden="true"></div>
      <div class="niz-intro-inner">
        <div class="niz-intro-brand">NIZALIAH PERFUME</div>
        <img class="niz-intro-logo" src="/images/logo-dark.png" alt="NIZALIAH Perfume" />
        <div class="niz-intro-row">
          <div class="niz-intro-counter" id="niz-intro-counter" aria-hidden="true">
            <span id="niz-intro-pct">00</span>
          </div>
          <div class="niz-intro-side">
            <div class="niz-intro-unit">PERCENT</div>
            <div class="niz-intro-status" id="niz-intro-status">COMPOSING</div>
          </div>
        </div>
        <div class="niz-intro-track" aria-hidden="true">
          <div class="niz-intro-bar" id="niz-intro-bar"></div>
        </div>
        <div class="niz-intro-meta">
          <span id="niz-intro-label">LOADING EXPERIENCE</span>
          <span>JANAN SPORT</span>
        </div>
        <div class="niz-intro-line" id="niz-intro-line">A fragrance journey is being prepared.</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
